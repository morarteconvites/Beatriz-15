<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Filtro com Moldura</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="container">

  <div class="camera-area">
    <video id="video" autoplay playsinline muted></video>
    <img id="frame" src="moldura.png">
    <canvas id="canvas"></canvas>
  </div>

  <div class="buttons">
    <button id="switchCamera">🔄 Virar câmera</button>
    <button id="startRecord">🔴 Gravar</button>
    <button id="stopRecord" style="display:none;">⏹️ Parar</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
